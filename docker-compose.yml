services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mon_user:mon_mot_de_passe@db:5432/mon_app_db
      - CAMERA_URL=http://172.20.10.2:8080/
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1547230234250575963/VzVrEp9Ekw9C7YG6-FkmIGYzmWM_RSu7Ka1KRBDIe50LhfDd8RliAo9gp3v0amZ4mCro
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-CamFire Security <no-reply@camfire.local>}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_mot_de_passe
      POSTGRES_DB: mon_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: