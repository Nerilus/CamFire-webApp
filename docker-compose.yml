services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
      - "5173:5173"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mon_user:mon_mot_de_passe@db:5432/mon_app_db
      - CAMERA_URL=http://172.20.10.2:8080/
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-CamFire Security <no-reply@camfire.local>}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mon_user
      POSTGRES_PASSWORD: mon_mot_de_passe
      POSTGRES_DB: mon_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: