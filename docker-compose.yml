services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
      - "5173:5173"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - captures_data:/app/static/captures
      - ./api:/app
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-camfire_prod_user}:${POSTGRES_PASSWORD:-camfire_secure_pass_2026}@db:5432/${POSTGRES_DB:-camfire_prod_db}
      - CAMERA_URL=${CAMERA_URL:-https://safely-virgin-mistress-staying.trycloudflare.com/stream.mjpg}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-CamFire Security <no-reply@camfire.local>}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camfire_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camfire_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-camfire_prod_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

volumes:
  postgres_prod_data:
  captures_data: